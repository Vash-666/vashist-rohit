<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A1B3A;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#252744;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1A1B3A;stop-opacity:1" />
    </linearGradient>
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.1"/>
      </feComponentTransfer>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#grad1)"/>
  <rect width="100%" height="100%" filter="url(#noise)" opacity="0.4"/>
  <ellipse cx="30%" cy="20%" rx="40%" ry="30%" fill="#D4A574" opacity="0.08"/>
  <ellipse cx="70%" cy="80%" rx="35%" ry="25%" fill="#FF9933" opacity="0.05"/>
</svg>