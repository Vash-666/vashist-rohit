<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="pivotGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1A1B3A;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#252744;stop-opacity:1" />
      <stop offset="70%" style="stop-color:rgba(212,165,116,0.3);stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D4A574;stop-opacity:1" />
    </linearGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="50"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#pivotGrad)"/>
  <circle cx="20%" cy="30%" r="200" fill="#FF9933" opacity="0.05" filter="url(#blur)"/>
  <circle cx="80%" cy="70%" r="250" fill="#D4A574" opacity="0.08" filter="url(#blur)"/>
</svg>