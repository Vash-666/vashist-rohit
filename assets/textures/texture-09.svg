<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="grad9" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" style="stop-color:#D4A574;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#C49464;stop-opacity:0.9" />
    </linearGradient>
    <filter id="noise9">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.15"/>
      </feComponentTransfer>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#grad9)"/>
  <rect width="100%" height="100%" filter="url(#noise9)" opacity="0.3"/>
