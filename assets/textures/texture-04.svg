<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="coachGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4A574;stop-opacity:0.9" />
      <stop offset="50%" style="stop-color:#E8C4A0;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#FF9933;stop-opacity:0.6" />
    </linearGradient>
    <filter id="noise2">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="4" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.15"/>
      </feComponentTransfer>
    </filter>
    <radialGradient id="woodGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#E8C4A0;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#D4A574;stop-opacity:0.1" />
    </radialGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#coachGrad)"/>
  <rect width="100%" height="100%" filter="url(#noise2)"/>
  <ellipse cx="50%" cy="50%" rx="60%" ry="40%" fill="url(#woodGrad)"/>
</svg>