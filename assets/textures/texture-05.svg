<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1A1B3A;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#2A3B4C;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#4A5B6C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6A7B8C;stop-opacity:1" />
    </linearGradient>
    <filter id="cloud">
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="5" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="100"/>
      <feGaussianBlur stdDeviation="20"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#skyGrad)"/>
  <ellipse cx="30%" cy="25%" rx="300" ry="150" fill="#87CEEB" opacity="0.1" filter="url(#cloud)"/>
  <ellipse cx="70%" cy="35%" rx="400" ry="180" fill="#B0C4DE" opacity="0.08" filter="url(#cloud)"/>
  <ellipse cx="50%" cy="15%" rx="250" ry="100" fill="#FFFFFF" opacity="0.05" filter="url(#cloud)"/>
</svg>