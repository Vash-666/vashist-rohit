<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="techGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A1B3A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2A2B4A;stop-opacity:1" />
    </linearGradient>
    <pattern id="grid" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M 100 0 L 0 0 0 100" fill="none" stroke="#D4A574" stroke-width="0.5" opacity="0.1"/>
    </pattern>
    <pattern id="circuit" width="200" height="200" patternUnits="userSpaceOnUse">
      <circle cx="50" cy="50" r="3" fill="#FF9933" opacity="0.2"/>
      <circle cx="150" cy="150" r="3" fill="#D4A574" opacity="0.15"/>
      <line x1="50" y1="50" x2="150" y2="50" stroke="#D4A574" stroke-width="1" opacity="0.1"/>
      <line x1="150" y1="50" x2="150" y2="150" stroke="#D4A574" stroke-width="1" opacity="0.1"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#techGrad)"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>
  <rect width="100%" height="100%" fill="url(#circuit)"/>
</svg>