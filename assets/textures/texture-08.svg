<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="grad8" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#252744;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1A1B3A;stop-opacity:1" />
    </linearGradient>
    <filter id="noise8">
      <feTurbulence type="fractalNoise" baseFrequency="0.6" numOctaves="4" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.1"/>
      </feComponentTransfer>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#grad8)"/>
  <rect width="100%" height="100%" filter="url(#noise8)" opacity="0.35"/>
</svg>