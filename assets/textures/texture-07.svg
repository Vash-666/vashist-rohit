<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="grad7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A1B3A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2A2B4A;stop-opacity:1" />
    </linearGradient>
    <filter id="noise7">
      <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.12"/>
      </feComponentTransfer>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#grad7)"/>
  <rect width="100%" height="100%" filter="url(#noise7)" opacity="0.4"/>
</svg>