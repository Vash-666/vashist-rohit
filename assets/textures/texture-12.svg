<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="grad12" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" style="stop-color:#050508;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0A0A0F;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0F0F14;stop-opacity:1" />
    </linearGradient>
    <filter id="noise12">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="4" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.13"/>
      </feComponentTransfer>
    </filter>
    <radialGradient id="glow12" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#D4A574;stop-opacity:0.08" />
      <stop offset="100%" style="stop-color:transparent;stop-opacity:0" />
    </radialGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#grad12)"/>
  <rect width="100%" height="100%" filter="url(#noise12)" opacity="0.35"/>
  <ellipse cx="50%" cy="50%" rx="45%" ry="35%" fill="url(#glow12)"/>
</svg>