<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="grad10" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A1B3A;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#2A3B4C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1A1B3A;stop-opacity:1" />
    </linearGradient>
    <filter id="noise10">
      <feTurbulence type="fractalNoise" baseFrequency="0.5" numOctaves="5" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.08"/>
      </feComponentTransfer>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#grad10)"/>
  <rect width="100%" height="100%" filter="url(#noise10)" opacity="0.4"/>
</svg>